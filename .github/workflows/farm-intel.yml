name: Farm intelligence (weather · crop calendar · soil)
on:
  schedule:
    - cron: "23 0 * * *"        # daily 05:53 IST, before farmers head out
  workflow_dispatch:
    inputs:
      only_test_farms:
        description: "Process only TEST farms (validation run)"
        type: boolean
        default: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults: { run: { working-directory: workers/farmintel } }
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: workers/farmintel/requirements.txt }
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - name: Fetch weather & soil, generate advisories
        run: python farm_intel.py
        env:
          ONLY_TEST_FARMS: ${{ github.event_name == 'workflow_dispatch' && inputs.only_test_farms || 'false' }}
          SEND_ALERTS: ${{ vars.SEND_ALERTS }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
      - name: Validation report
        if: github.event_name == 'workflow_dispatch'
        run: python validate.py
