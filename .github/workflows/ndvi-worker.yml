name: NDVI crop-health worker
on:
  schedule:
    - cron: "17 1 */2 * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults: { run: { working-directory: workers/ndvi } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: workers/ndvi/requirements.txt }
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
      - run: python ndvi_worker.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
